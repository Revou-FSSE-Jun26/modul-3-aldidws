<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>RevoShop</title>
    <style>
      :root {
        --indigo: #4f46e5;
        --indigo-dark: #4338ca;
        --gray-900: #111827;
        --gray-600: #4b5563;
        --gray-300: #d1d5db;
        --gray-200: #e5e7eb;
        --gray-100: #f3f4f6;
        --green: #16a34a;
        --red: #dc2626;
        --amber: #f59e0b;
      }

      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        font-family: system-ui, -apple-system, Segoe UI, Roboto, Helvetica,
          Arial, sans-serif;
        color: var(--gray-900);
        background: linear-gradient(135deg, #192b63 0%, #f5f3ff 55%, #e36de7 100%);
        min-height: 100vh;
        line-height: 1.5;
        padding: 24px 16px;
      }

      .layout {
        max-width: 1000px;
        margin: 0 auto;
        display: grid;
        gap: 20px;
      }

      header.topbar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 16px;
        color: #fff;
      }

      header.topbar h1 {
        font-size: 1.5rem;
      }

      .cart-pill {
        background: rgba(255, 255, 255, 0.15);
        border: 1px solid rgba(255, 255, 255, 0.4);
        padding: 8px 16px;
        border-radius: 999px;
        font-weight: 600;
        backdrop-filter: blur(4px);
      }

      .card {
        background: #fff;
        border-radius: 16px;
        padding: 20px;
        box-shadow: 0 10px 30px rgba(17, 24, 39, 0.15);
      }

      .card h2 {
        margin-bottom: 12px;
        font-size: 1.15rem;
      }

      /* ---- toolbar / filters ---- */
      .toolbar {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        margin-bottom: 16px;
        align-items: center;
      }

      input[type="text"] {
        flex: 1 1 200px;
        padding: 10px 12px;
        border: 1px solid var(--gray-300);
        border-radius: 8px;
        font-size: 0.95rem;
      }

      button,
      select {
        cursor: pointer;
        border: none;
        border-radius: 8px;
        padding: 10px 14px;
        font-size: 0.9rem;
        font-weight: 600;
        background: var(--indigo);
        color: #fff;
        transition: background 0.15s ease, transform 0.05s ease;
      }

      select {
        background: #fff;
        color: var(--gray-900);
        border: 1px solid var(--gray-300);
      }

      button:hover {
        background: var(--indigo-dark);
      }

      button:active {
        transform: translateY(1px);
      }

      button.chip {
        background: var(--gray-200);
        color: var(--gray-900);
        border-radius: 999px;
        padding: 6px 14px;
      }

      button.chip.active {
        background: var(--indigo);
        color: #fff;
      }

      /* ---- product grid ---- */
      .grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
        gap: 14px;
      }

      .product {
        border: 1px solid var(--gray-200);
        border-radius: 12px;
        padding: 14px;
        display: flex;
        flex-direction: column;
        gap: 6px;
        transition: box-shadow 0.15s ease, border-color 0.15s ease;
      }

      .product:hover {
        box-shadow: 0 6px 18px rgba(17, 24, 39, 0.12);
        border-color: var(--gray-300);
      }

      .product.out {
        opacity: 0.55;
      }

      .product .media {
        display: flex;
        flex-direction: column;
        gap: 8px;
      }

      .product .product-img {
        width: 100%;
        height: 140px;
        object-fit: cover;
        border-radius: 10px;
        background: var(--gray-100);
        display: block;
      }

      .product .product-img.placeholder {
        display: flex;
        border: 1px dashed var(--gray-300);
      }

      /* Broken/empty image sources still show a friendly placeholder box */
      .product .product-img:not([src]),
      .product .product-img[src=""] {
        min-height: 140px;
      }

      .upload-btn {
        display: inline-block;
        text-align: center;
        cursor: pointer;
        border-radius: 8px;
        padding: 8px 12px;
        font-size: 0.8rem;
        font-weight: 600;
        background: var(--gray-200);
        color: var(--gray-900);
        transition: background 0.15s ease;
      }

      .upload-btn:hover {
        background: var(--gray-300);
      }

      .upload-input {
        display: none;
      }

      .cart-label {
        display: flex;
        align-items: center;
        gap: 8px;
      }

      .cart-thumb {
        width: 32px;
        height: 32px;
        object-fit: cover;
        border-radius: 6px;
      }

      .product .name {
        font-weight: 600;
      }

      .product .cat {
        font-size: 0.75rem;
        text-transform: uppercase;
        letter-spacing: 0.04em;
        color: var(--gray-600);
      }

      .product .price {
        font-weight: 700;
        color: var(--indigo-dark);
      }

      .product .rating {
        font-size: 0.8rem;
        color: var(--amber);
      }

      .product button {
        margin-top: auto;
        width: 100%;
      }

      .product button.disabled {
        background: var(--gray-200);
        color: var(--gray-600);
        cursor: not-allowed;
      }

      .badge {
        align-self: flex-start;
        font-size: 0.7rem;
        font-weight: 700;
        padding: 2px 8px;
        border-radius: 999px;
        background: #fee2e2;
        color: var(--red);
      }

      /* ---- cart ---- */
      ul#cart-items {
        list-style: none;
        display: grid;
        gap: 8px;
        margin-bottom: 12px;
      }

      ul#cart-items li {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 10px;
        padding: 10px 12px;
        border: 1px solid var(--gray-200);
        border-radius: 8px;
      }

      .qty {
        display: flex;
        align-items: center;
        gap: 8px;
      }

      .qty button {
        padding: 2px 10px;
        background: var(--gray-200);
        color: var(--gray-900);
      }

      .empty {
        color: var(--gray-600);
        font-style: italic;
      }

      .totals {
        border-top: 2px dashed var(--gray-200);
        padding-top: 12px;
        display: grid;
        gap: 4px;
        font-size: 0.95rem;
      }

      .totals .row {
        display: flex;
        justify-content: space-between;
      }

      .totals .grand {
        font-weight: 700;
        font-size: 1.05rem;
      }

      /* ---- array report ---- */
      .output {
        background: #0f172a;
        color: #e2e8f0;
        border-radius: 10px;
        padding: 16px;
        font-family: "SF Mono", Consolas, Menlo, monospace;
        font-size: 0.82rem;
        white-space: pre-wrap;
        min-height: 60px;
      }

      .two-col {
        display: grid;
        grid-template-columns: 1.4fr 1fr;
        gap: 20px;
      }

      @media (max-width: 760px) {
        .two-col {
          grid-template-columns: 1fr;
        }
      }
    </style>
  </head>
  <body>
    <div class="layout">
      <header class="topbar">
        <h1>RevoShop</h1>
        <span class="cart-pill" id="cart-pill">Cart: 0 items · $0.00</span>
      </header>

      <div class="two-col">
        <!-- ============ CATALOG (DOM + events) ============ -->
        <section class="card">
          <h2>Catalog</h2>
          <div class="toolbar">
            <input type="text" id="search" placeholder="Search products…" />
            <select id="sort">
              <option value="default">Sort: featured</option>
              <option value="price-asc">Price: low → high</option>
              <option value="price-desc">Price: high → low</option>
              <option value="rating">Rating</option>
            </select>
          </div>
          <div class="toolbar" id="category-filters"></div>
          <div class="grid" id="product-grid"></div>
        </section>

        <!-- ============ CART (DOM + events) ============ -->
        <section class="card">
          <h2>Your Cart</h2>
          <ul id="cart-items"></ul>
          <div class="totals" id="cart-totals"></div>
          <div class="toolbar" style="margin-top: 12px">
            <button id="clear-cart" class="chip">Clear cart</button>
          </div>
        </section>
      </div>

      <!-- ============ ARRAY PROCESSING ============ -->
      <section class="card">
        <h2>Store Analytics (forEach · map · filter · reduce)</h2>
        <div class="toolbar">
          <button id="run-analytics">Run analytics</button>
        </div>
        <pre id="analytics-output" class="output">Click "Run analytics" — results also log to the console.</pre>
      </section>
    </div>

    <script src="array.js"></script>
    <script src="dom.js"></script>
  </body>
</html>
