<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Revo Performance Shop</title>
    <link rel="stylesheet" href="./dist/output.css" />
  </head>
  <body
    class="min-h-screen bg-carbon-900 bg-carbon-grid px-4 py-6 font-sans text-gray-100"
  >
    <div class="mx-auto grid max-w-7xl gap-5">
      <header
        class="panel overflow-hidden"
      >
        <div class="m-stripe"></div>
        <div class="flex items-center justify-between gap-4 px-5 py-4">
          <div class="flex items-center gap-3">
            <span
              class="grid h-11 w-11 place-items-center rounded-full border-2 border-white/70 bg-carbon-700 text-sm font-black tracking-tighter text-white shadow-glow"
              >RVS</span
            >
            <div class="leading-tight">
              <h1
                class="text-2xl font-black uppercase tracking-widest text-white text-glow"
              >
                REVO <span class="text-mblue"></span> Shop
              </h1>
              <p class="text-xs uppercase tracking-[0.3em] text-gray-400">
                Performance · Parts · Motorsport
              </p>
            </div>
          </div>
          <span
            id="cart-pill"
            class="rounded-full border border-mblue/50 bg-mblue/10 px-4 py-2 font-semibold text-white backdrop-blur"
            >Cart: 0 items · Rp 0</span
          >
        </div>
      </header>

      <div class="grid gap-5 md:grid-cols-[2.2fr_1fr]">
        <section class="panel p-5">
          <div class="mb-3 flex items-center gap-3">
            <span class="m-stripe-vertical h-6"></span>
            <h2 class="text-lg font-bold uppercase tracking-wider text-white">
              Catalog
            </h2>
          </div>

          <div class="mb-4 flex flex-wrap items-center gap-2">
            <input
              type="text"
              id="search"
              placeholder="Search parts…"
              class="flex-1 basis-48 rounded-lg border border-white/15 bg-carbon-700 px-3 py-2.5 text-[0.95rem] text-white placeholder:text-gray-500 focus:border-mblue focus:outline-none focus:ring-2 focus:ring-mblue/40"
            />
            <select
              id="sort"
              class="rounded-lg border border-white/15 bg-carbon-700 px-3.5 py-2.5 text-sm font-semibold text-white focus:border-mblue focus:outline-none"
            >
              <option value="default">Sort: featured</option>
              <option value="price-asc">Price: low → high</option>
              <option value="price-desc">Price: high → low</option>
              <option value="rating">Rating</option>
            </select>
          </div>

          <div id="category-filters" class="mb-4 flex flex-wrap gap-2"></div>

          <div
            id="product-grid"
            class="grid grid-cols-2 gap-3.5 sm:grid-cols-3 lg:grid-cols-4"
          ></div>
        </section>

        <section class="panel p-5">
          <div class="mb-3 flex items-center gap-3">
            <span class="m-stripe-vertical h-6"></span>
            <h2 class="text-lg font-bold uppercase tracking-wider text-white">
              Your Cart
            </h2>
          </div>
          <ul id="cart-items" class="mb-3 grid list-none gap-2"></ul>
          <div
            id="cart-totals"
            class="grid gap-1 border-t border-dashed border-white/15 pt-3 text-[0.95rem] text-gray-200"
          ></div>
          <div class="mt-3 flex flex-wrap gap-2">
            <button
              id="clear-cart"
              class="rounded-full border border-white/15 bg-carbon-700 px-3.5 py-1.5 text-sm font-semibold text-gray-100 transition hover:border-mred/60 hover:text-mred"
            >
              Clear cart
            </button>
          </div>
        </section>
      </div>
    </div>

    <script type="module" src="./dist/main.js"></script>
  </body>
</html>
